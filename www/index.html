<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Entity AI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d12;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}.login-card{width:min(430px,100%);padding:30px;border:1px solid #242936;border-radius:24px;background:linear-gradient(180deg,#171a22,#101219);box-shadow:0 20px 60px rgba(0,0,0,.45)}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 18px;background:linear-gradient(135deg,#4285f4,#6d5dfc);font-size:30px;font-weight:800}.login-card h1{text-align:center;margin:0;font-size:30px}.subtitle{text-align:center;color:#9aa3b2;margin:8px 0 28px;font-size:14px}.login-btn{width:100%;height:52px;border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:600;cursor:pointer}.google-btn{background:#fff;color:#222}.offline-btn{margin-top:12px;background:#222733;color:#fff;border:1px solid #343b4a}.offline-box{display:none;margin-top:14px}.offline-box.active{display:block}.offline-box input{width:100%;height:48px;border:1px solid #343b4a;background:#0d1016;color:#fff;border-radius:12px;padding:0 14px;font-size:15px;outline:none}.small{font-size:12px;color:#7f8998;text-align:center;margin-top:18px;line-height:1.5}footer{text-align:center;color:#5f6877;font-size:11px;margin-top:22px}
</style></head><body><div class="login-card"><div class="logo">E</div><h1>Entity AI</h1><div class="subtitle">Your AI assistant</div>
<button class="login-btn google-btn" onclick="triggerGoogleLogin()">Sign in with Google</button>
<button class="login-btn offline-btn" onclick="toggleOffline()">Continue offline</button>
<div class="offline-box" id="offlineBox"><input id="offlineName" maxlength="40" placeholder="Enter your name"><button class="login-btn offline-btn" style="margin-top:10px" onclick="offlineLogin()">Continue</button></div>
<div class="small">Offline mode keeps your profile and chat history on this device. AI replies and image generation need internet.</div><footer>Entity AI • Created by Damar Aman</footer></div>
<script src="capacitor.js"></script><script>
if(localStorage.getItem('entityUser')) location.replace('chat.html');
async function triggerGoogleLogin(){
 try{
  const plugin=window.Capacitor?.Plugins?.GoogleSignIn;
  if(!plugin) throw new Error('Google sign-in plugin unavailable');
  await plugin.initialize({clientId:'752902709629-n38560sohmn3b9tctf6cjg21sef3dnbe.apps.googleusercontent.com',scopes:['profile','email']});
  const user=await plugin.signIn();
  localStorage.setItem('entityUser',JSON.stringify({name:user?.displayName||user?.givenName||'User',givenName:user?.givenName||user?.displayName||'User',email:user?.email||'',imageUrl:user?.photoUrl||'',offline:false}));
  location.replace('chat.html');
 }catch(error){console.error(error);const m=String(error?.message||error?.code||'').toLowerCase();if(!m.includes('cancel')&&!m.includes('dismiss'))alert('Google sign-in failed. You can use Continue offline.');}
}
function toggleOffline(){document.getElementById('offlineBox').classList.toggle('active');document.getElementById('offlineName').focus()}
function offlineLogin(){const name=document.getElementById('offlineName').value.trim()||'User';localStorage.setItem('entityUser',JSON.stringify({name,givenName:name,email:'offline@entity.local',offline:true}));location.replace('chat.html')}
</script></body></html>
